name: Pipeline contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pipeline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prototype parity and BPE corpus preparation
        run: python tests/test_pipeline_contract.py
